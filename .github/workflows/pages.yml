name: Check and deploy GitHub Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      NO_INDEX: ${{ vars.NO_INDEX || 'true' }}
      PUBLIC_CLOUDFLARE_BEACON_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/axe-audit.mjs
      - run: node scripts/print-audit.mjs
      - run: node scripts/ux-audit.mjs
      - run: node scripts/header-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: work/print-audit/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with: { path: dist }
  draft-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/audit-draft-previews.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-browser-review
          path: work/draft-review/
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
